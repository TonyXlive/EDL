<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15233B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="État des lieux">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icone-192.png">
<title>État des lieux — entrée &amp; sortie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Polices chargees sans bloquer l'affichage : sur un reseau lent ou un portail
     captif, l'application doit s'ouvrir immediatement avec les polices systeme
     plutot que d'attendre une reponse qui peut ne jamais venir. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --papier:#E9EDF2; --carte:#FFFFFF; --encre:#15233B; --encre2:#53637C;
  --champ:#EAF0F7; --trait:#C2CEDD; --tampon:#4B2E83;
  --neuf:#0F6B4F; --bon:#5E8C2A; --usage:#B4761A; --mauvais:#A32A1F; --so:#78859A;
  --r:5px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{background:var(--papier);color:var(--encre);font-family:"Public Sans",system-ui,sans-serif;font-size:15.5px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;font-family:"Archivo Narrow",system-ui,sans-serif;font-weight:700}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tampon);outline-offset:2px}

/* ===== barre haute ===== */
.barre{position:sticky;top:0;z-index:30;background:var(--encre);color:#fff}
.barre-in{max-width:600px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:10px}
.barre h1{font-size:15px;text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.barre .marque{font-family:"IBM Plex Mono",monospace;font-size:11px;color:#8EA3C0;margin-left:auto}
.barre h1{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.barre .marque{white-space:nowrap;margin-left:auto}
.barre .sauve{flex:none;width:18px;height:18px;border-radius:50%;background:#1E7A54;color:#DFF5E8;
  font-size:11px;line-height:18px;text-align:center;opacity:0;transform:scale(.6);
  transition:opacity .2s, transform .2s}
.barre .sauve.vu{opacity:1;transform:scale(1)}
.barre .sauve.ko{background:#8C2A20;color:#FFE0DC}
.menu-btn{background:none;border:1px solid #46587A;color:#fff;border-radius:var(--r);padding:5px 9px;line-height:1;font-size:17px}
.menu{position:absolute;right:16px;top:52px;background:#fff;border:1px solid var(--trait);border-radius:var(--r);box-shadow:0 8px 24px rgba(21,35,59,.18);overflow:hidden;display:none;min-width:220px}
.menu.ouvert{display:block}
.menu button{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #EDF1F6;padding:11px 14px;color:var(--encre);font-size:14.5px}
.menu button:last-child{border-bottom:0}
.menu button:hover{background:#F2F6FB}
.jauge-pas{height:4px;background:#22344F}
.jauge-pas div{height:100%;background:var(--tampon);transition:width .3s ease}
@media(prefers-reduced-motion:reduce){.jauge-pas div{transition:none}}

/* ===== écran ===== */
main{max-width:600px;margin:0 auto;padding:20px 16px 130px}
.compte-pas{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--encre2);letter-spacing:.04em;margin-bottom:6px}
.titre-pas{font-size:23px;line-height:1.22;margin-bottom:4px}
.sous-pas{color:var(--encre2);font-size:14px;margin:0 0 20px}

/* ===== gros choix ===== */
.choix{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.choix.trois{grid-template-columns:repeat(3,1fr)}
.carte-choix{
  background:var(--carte);border:1.5px solid var(--trait);border-radius:var(--r);
  padding:22px 10px;display:flex;flex-direction:column;align-items:center;gap:9px;
  font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:15px;
  text-transform:uppercase;letter-spacing:.05em;color:var(--encre);
}
.carte-choix svg{width:30px;height:30px;stroke:var(--encre2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.carte-choix:hover{border-color:var(--encre2)}
.carte-choix[aria-pressed=true]{background:var(--encre);color:#fff;border-color:var(--encre)}
.carte-choix[aria-pressed=true] svg{stroke:#fff}

/* ===== champs ===== */
.pile{display:flex;flex-direction:column;gap:13px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:460px){.duo{grid-template-columns:1fr}}
label.champ{display:flex;flex-direction:column;gap:5px}
label.champ>span{font-family:"Archivo Narrow",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.07em;font-size:11.5px;color:var(--encre2)}
input[type=text],input[type=date],input[type=email],input[type=tel],select,textarea{
  background:var(--champ);border:1px solid var(--trait);border-bottom:2px solid #9FB0C6;
  border-radius:3px;padding:11px 10px;width:100%;
}
textarea{resize:vertical;min-height:110px}
input:focus,select:focus,textarea:focus{background:#fff}
.bloc-blanc{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:14px;margin-bottom:12px}
.bloc-blanc h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--encre2);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.bloc-blanc h3 .sup{margin-left:auto}
.ajout{background:#fff;border:1.5px dashed var(--tampon);color:var(--tampon);border-radius:var(--r);padding:11px 14px;width:100%;
  font-family:"Archivo Narrow",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:13.5px}
.ajout:hover{background:#F3EFFA}
.sup{background:#fff;border:1px solid var(--trait);color:var(--mauvais);border-radius:3px;padding:5px 9px;font-weight:700;line-height:1}
.sup:hover{background:#FBEDEC}
.note{font-size:13px;color:var(--encre2);line-height:1.55}
.note strong{color:var(--encre)}

/* ===== compteur ===== */
.face-lab{font-family:"Archivo Narrow",sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--encre2);margin:10px 0 4px}
.face{background:#11161F;border-radius:3px;padding:9px 11px;display:flex;align-items:center;gap:8px;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.face input{background:transparent;border:0;font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;color:#F2C14E;letter-spacing:.24em;padding:0;width:100%}
.face input:focus{background:transparent;color:#FFD877;outline:none}
.face .unite{font-family:"IBM Plex Mono",monospace;font-size:11px;color:#7E8CA3;flex:none}

/* ===== composition ===== */
.ligne-piece{display:flex;align-items:center;gap:10px;background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.ligne-piece b{font-family:"Archivo Narrow",sans-serif;font-weight:600;font-size:15px;flex:1}
.pas-a-pas{display:flex;align-items:center;gap:0;border:1px solid var(--trait);border-radius:4px;overflow:hidden}
.pas-a-pas button{background:#fff;border:0;width:40px;height:38px;font-size:19px;line-height:1;color:var(--encre)}
.pas-a-pas button:hover{background:#EEF3F9}
.pas-a-pas span{width:34px;text-align:center;font-family:"IBM Plex Mono",monospace;font-weight:600;border-left:1px solid var(--trait);border-right:1px solid var(--trait);height:38px;line-height:38px}

/* ===== élément d'une pièce ===== */
.elt{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:12px;margin-bottom:10px}
.elt.fait{border-left:4px solid var(--neuf)}
.elt.fait[data-e=M]{border-left-color:var(--mauvais)}
.elt.fait[data-e=U]{border-left-color:var(--usage)}
.elt.fait[data-e=B]{border-left-color:var(--bon)}
.elt.fait[data-e=S]{border-left-color:var(--so)}
.elt-tete{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.elt-tete b{font-family:"Archivo Narrow",sans-serif;font-weight:600;font-size:15.5px;flex:1}
.rappel{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--encre2);display:block;font-weight:400;letter-spacing:0}
.notes{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:9px}
.notes button{
  border:1.5px solid var(--trait);background:#fff;border-radius:4px;padding:9px 2px;
  font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:12px;color:var(--encre2);
  text-transform:uppercase;letter-spacing:.02em;line-height:1.15;
}
.notes button:hover{border-color:var(--encre2)}
.notes button[aria-pressed=true]{color:#fff;border-color:transparent}
.notes button[data-v=N][aria-pressed=true]{background:var(--neuf)}
.notes button[data-v=B][aria-pressed=true]{background:var(--bon)}
.notes button[data-v=U][aria-pressed=true]{background:var(--usage)}
.notes button[data-v=M][aria-pressed=true]{background:var(--mauvais)}
.notes button[data-v=S][aria-pressed=true]{background:var(--so)}
.elt input.com{background:#F6F9FC;border:1px solid var(--trait);border-bottom:2px solid #9FB0C6;border-radius:3px;padding:9px;width:100%;font-size:14px}
.photo-btn{display:inline-flex;align-items:center;gap:7px;margin-top:9px;background:#fff;border:1px solid var(--trait);border-radius:4px;padding:8px 12px;
  font-family:"Archivo Narrow",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:12.5px;color:var(--encre)}
.photo-btn:hover{background:#F2F6FB}
.photo-btn svg{width:17px;height:17px;stroke:var(--tampon);fill:none;stroke-width:1.7}
.photo-btn input{display:none}
.photos{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.photo{position:relative;width:78px;height:78px;border:1px solid var(--trait);border-radius:3px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo button{position:absolute;top:2px;right:2px;background:rgba(255,255,255,.92);border:1px solid var(--trait);border-radius:3px;line-height:1;padding:2px 5px;color:var(--mauvais);font-weight:700;font-size:12px}

/* ===== signatures ===== */
.sig{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:12px;margin-bottom:12px}
.sig canvas{width:100%;height:140px;background:#fff;border:1px dashed var(--trait);border-radius:3px;touch-action:none;display:block}
.sig-tete{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.sig-tete span{font-family:"Archivo Narrow",sans-serif;text-transform:uppercase;letter-spacing:.07em;font-size:11.5px;color:var(--encre2)}
.sig-tete button{margin-left:auto;background:none;border:0;color:var(--tampon);font-size:13px;text-decoration:underline;padding:0}

/* ===== récapitulatif ===== */
.recap{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.recap button{display:flex;width:100%;gap:10px;align-items:center;background:#fff;border:0;border-bottom:1px solid #EDF1F6;padding:12px 14px;text-align:left;color:var(--encre);font-size:14.5px}
.recap button:last-child{border-bottom:0}
.recap button:hover{background:#F2F6FB}
.recap .st{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--encre2);white-space:nowrap}
.recap .st.ko{color:var(--mauvais)}
.grand{background:var(--tampon);color:#fff;border:0;border-radius:var(--r);padding:15px;width:100%;
  font-family:"Archivo Narrow",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:15px;margin-bottom:10px}
.grand:hover{background:#5C3A9C}
.grand.secondaire{background:#fff;color:var(--encre);border:1.5px solid var(--trait)}
.grand.secondaire:hover{background:#F2F6FB}

/* ===== navigation basse ===== */
/* --fond : hauteur de ce que le navigateur ou le systeme pose en bas de
   l'ecran (clavier, barre de saisie automatique, barre de navigation). Il est
   mesure en JS ; sans lui, la barre Retour / Suivant se retrouve dessous et
   devient impossible a atteindre. */
.nav{position:fixed;left:0;right:0;bottom:var(--fond,0px);background:rgba(233,237,242,.94);backdrop-filter:blur(6px);border-top:1px solid var(--trait);z-index:25}
.nav-in{max-width:600px;margin:0 auto;padding:11px 16px calc(11px + env(safe-area-inset-bottom));display:flex;gap:10px}
.nav button{flex:1;border-radius:var(--r);padding:13px;font-family:"Archivo Narrow",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:14.5px}
.retour{background:#fff;border:1.5px solid var(--trait);color:var(--encre)}
.retour:hover{background:#F2F6FB}
.suivant{background:var(--tampon);border:0;color:#fff;flex:1.6}
.suivant:hover{background:#5C3A9C}
.retour[hidden],.suivant[hidden]{display:none}

/* ===== état à l'entrée (mode sortie) ===== */
.avant{background:#F4F7FB;border:1px solid #DCE5EF;border-radius:4px;padding:9px;margin-bottom:10px}
.avant-lab{font-family:"Archivo Narrow",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.07em;font-size:10.5px;color:var(--encre2);margin-bottom:5px}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:6px}
.mini button{border:1px solid var(--trait);background:#fff;border-radius:3px;padding:7px 2px;font-family:"Archivo Narrow",sans-serif;font-weight:600;font-size:11.5px;color:var(--encre2)}
.mini button[aria-pressed=true]{background:var(--encre2);color:#fff;border-color:var(--encre2)}
.avant input{width:100%;background:#fff;border:1px solid var(--trait);border-radius:3px;padding:8px;font-size:13.5px}
.face.petite input{font-size:17px;color:#A9B6C9;letter-spacing:.2em}
.carte-choix em{font-family:"Public Sans",sans-serif;font-style:normal;font-weight:400;font-size:12.5px;
  text-transform:none;letter-spacing:0;color:var(--encre2);line-height:1.35;text-align:center}
.carte-choix[aria-pressed=true] em{color:#C3D0E4}
.photo-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.photo-actions .photo-btn{margin-top:0;flex:1;justify-content:center}
.photo-btn.secondaire{color:var(--encre2)}
.photo-btn.secondaire svg{stroke:var(--encre2)}
.paraphe-pad canvas{height:80px}
@media(min-width:760px){.paraphe-pad canvas{height:100px}}
/* ===== tablette ===== */
.grille-elts{display:grid;gap:11px}
.grille-elts .elt{margin-bottom:0}
@media(min-width:760px){
  .barre-in,main,.nav-in{max-width:880px}
  main{padding:26px 22px 132px}
  .titre-pas{font-size:27px}
  body{font-size:16.5px}
  .grille-elts{grid-template-columns:1fr 1fr;align-items:start}
  .choix{grid-template-columns:repeat(2,1fr);gap:16px}
  .choix.trois{grid-template-columns:repeat(3,1fr)}
  .carte-choix{padding:30px 12px;font-size:16px}
  .carte-choix svg{width:36px;height:36px}
  .notes button{padding:13px 2px;font-size:13px}
  .photo-btn{padding:11px 16px;font-size:13.5px}
  .photo{width:92px;height:92px}
  .nav button{padding:16px;font-size:15.5px}
  .sig canvas{height:190px}
  .pas-a-pas button{width:52px;height:46px;font-size:22px}
  .pas-a-pas span{width:44px;height:46px;line-height:46px}
  input[type=text],input[type=date],select,textarea{padding:13px 12px}
}
@media(min-width:760px) and (orientation:landscape){
  .sigs-duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
}
/* ===== document imprimé ===== */
#impression{display:none}
.doc{font-size:11px;color:#000}
@media print{
  body{background:#fff !important}
  .barre,main,.nav,.menu,.toast{display:none !important}
  #impression{display:block}
  @page{size:A4;margin:13mm 12mm 13mm}
  .doc thead{display:table-header-group}
  .doc tr{page-break-inside:avoid;break-inside:avoid}
  .doc .piece-doc{page-break-inside:auto;break-inside:auto}
  .doc .piece-doc h3{page-break-after:avoid;break-after:avoid}
  .doc h2{page-break-after:avoid;break-after:avoid}
  .doc .ph figure{page-break-inside:avoid;break-inside:avoid}
  /* Ossature qui repete le pied de page en bas de chaque page imprimee. Ses
     propres lignes doivent pouvoir se couper, sinon tout le document serait
     traite comme un bloc insecable. */
  .doc .mise>tfoot{display:table-footer-group}
  .doc .mise>tbody>tr,.doc .mise>tfoot>tr{page-break-inside:auto;break-inside:auto}
}
.doc{padding-bottom:0}
.doc h1{font-size:19px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.doc h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;margin:14px 0 5px;padding-bottom:2px;border-bottom:1.5px solid #000}
.doc .doc-tete{border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-end}
.doc table{width:100%;border-collapse:collapse;margin-bottom:4px}
/* overflow-wrap:anywhere : sans cela, un mot tres long (URL, reference sans
   espace) elargit sa colonne au-dela de la page et le texte des colonnes
   suivantes est coupe net au bord du papier. */
.doc th,.doc td{border:.6px solid #6B7480;padding:3px 5px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.doc th{background:#E8EDF3;font-family:"Archivo Narrow",sans-serif;text-transform:uppercase;font-size:9.5px;letter-spacing:.05em}
.doc .kv td:first-child{width:32%;background:#F4F7FA;font-weight:600}
.doc .piece-doc{margin-bottom:9px}
.doc tr.baisse td{background:#FBEEEC}
.doc tr.baisse-legere td{background:#FBF6EC}
.doc .quand{font-size:8px;color:#444;margin-top:2px}
.doc .annexe{page-break-before:always}
.doc .piece-doc h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;background:#000;color:#fff;padding:2px 6px;margin:0 0 3px}
.doc .ph{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 6px}
.doc .ph figure{margin:0;width:118px}
.doc .ph img{width:118px;height:88px;object-fit:cover;border:.6px solid #6B7480;display:block}
.doc .ph figcaption{font-size:7.5px;line-height:1.25;padding-top:1px}
.doc .sig-doc{display:flex;gap:14px;margin-top:8px;page-break-inside:avoid}
.doc .sig-doc div{flex:1;border:.6px solid #6B7480;padding:5px;min-height:110px}
.doc .sig-doc img{max-width:100%;max-height:78px}
.doc .mentions{margin-top:10px;font-size:8.5px;color:#333;line-height:1.4;border-top:.6px solid #6B7480;padding-top:4px}
/* Ossature du document : une seule cellule qui porte tout le corps, plus un
   <tfoot> repete en bas de chaque page a l'impression. Elle ne doit rien
   changer a l'apparence, d'ou l'absence de bordure et de marge interieure. */
.doc .mise{width:100%;border-collapse:collapse}
.doc .mise>tbody>tr>td,.doc .mise>tfoot>tr>td{border:0;padding:0}
.doc .pied-page{display:flex;align-items:flex-end;gap:10px;min-height:12mm;
  border-top:.6px solid #6B7480;padding-top:2px;font-size:8px;color:#333}
.doc .pied-page div{display:flex;align-items:flex-end;gap:4px}
.doc .pied-page img{height:11mm;max-width:26mm;object-fit:contain}
.doc .pied-page .vide{display:inline-block;width:24mm;border-bottom:.6px dotted #6B7480}
.doc .pied-page .ref{margin-left:auto;text-align:right;font-family:"IBM Plex Mono",monospace}

/* ================= finition visuelle ================= */
:root{
  --papier:#EBEFF5; --carte:#FFFFFF; --encre:#111D33; --encre2:#5A6A82;
  --champ:#EDF2F8; --trait:#CFD9E6; --tampon:#4B2E83; --r:10px;
  --ombre:0 1px 2px rgba(17,29,51,.05), 0 14px 28px -22px rgba(17,29,51,.55);
}
body{background:radial-gradient(1100px 620px at 50% -8%, #F8FAFD, var(--papier)) fixed}

.barre{background:linear-gradient(180deg,#1B2C4B 0%,#111D33 100%);border-bottom:0;box-shadow:0 6px 22px -18px #000}
.barre h1{font-size:14px;letter-spacing:.16em;font-weight:600}
.barre .marque{letter-spacing:.14em;color:#93A8C6}
.menu-btn{border-color:rgba(255,255,255,.22);border-radius:8px;padding:6px 10px;transition:background .15s}
.menu-btn:hover{background:rgba(255,255,255,.1)}
.jauge-pas{height:5px;background:rgba(255,255,255,.09)}

function horodate(d){

}

/* Les images du document proviennent parfois d'un fichier .json fourni par

function srcImg(v){

function empreinte(cb){

        cb(Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0"+b.toString(16)).slice(-2); }).join(""));
      }).catch(function(){ cb(""); });

  }catch(e){}

}

/* ================= sauvegarde automatique ================= */
var DB = null, DBko = false, CLE = "edl:brouillon";
function ouvreDB(cb){
  if(DB) return cb(DB);
  if(DBko || !window.indexedDB) return cb(null);
  var fait = false;
  function fini(d){ if(fait) return; fait = true; cb(d); }
  try{
    var r = indexedDB.open("edl-brouillon", 1);
    r.onupgradeneeded = function(){
      var d = r.result;
      if(!d.objectStoreNames.contains("etat")) d.createObjectStore("etat");
    };
    r.onsuccess = function(){ DB = r.result; fini(DB); };
    r.onerror = function(){ DBko = true; fini(null); };
    r.onblocked = function(){ DBko = true; fini(null); };
    setTimeout(function(){ if(!fait){ DBko = true; fini(null); } }, 2500);
  }catch(e){ DBko = true; fini(null); }
}
function ecritLS(o, cb){
  try{ localStorage.setItem(CLE, JSON.stringify(o)); if(cb) cb(true); }
  catch(e){ if(cb) cb(false); }
}
function ecritBrouillon(o, cb){
  ouvreDB(function(d){
    if(d){
      try{
        var tx = d.transaction("etat", "readwrite");
        tx.objectStore("etat").put(o, "brouillon");
        tx.oncomplete = function(){ if(cb) cb(true); };
        tx.onerror = function(){ ecritLS(o, cb); };
        tx.onabort = function(){ ecritLS(o, cb); };
        return;
      }catch(e){}
    }
    ecritLS(o, cb);
  });
}
function litLS(cb){
  try{
    var t = localStorage.getItem(CLE);
    cb(t ? JSON.parse(t) : null);
  }catch(e){ cb(null); }
}
function litBrouillon(cb){
  ouvreDB(function(d){
    if(d){
      try{
        var tx = d.transaction("etat", "readonly");
        var q = tx.objectStore("etat").get("brouillon");
        q.onsuccess = function(){ if(q.result) return cb(q.result); litLS(cb); };
        q.onerror = function(){ litLS(cb); };
        return;
      }catch(e){}
    }
    litLS(cb);
  });
}
function videBrouillon(){
  ouvreDB(function(d){
    if(d){ try{ d.transaction("etat", "readwrite").objectStore("etat").delete("brouillon"); }catch(e){} }
    try{ localStorage.removeItem(CLE); }catch(e){}
  });
}

function enregistreBrouillon(cb){
  if(minuteur){ clearTimeout(minuteur); minuteur = null; }
  /* Pas de copie profonde de l'etat : elle recopiait toutes les photos en
     memoire a chaque frappe de touche (8 Mo mesures pour 40 photos), ce qui
     mettait la tablette sous pression et pouvait la conduire a fermer
     l'application. Les deux enregistrements font deja leur propre copie :
     la base de l'appareil au moment de l'ecriture, le stockage simple en
     convertissant en texte. */
  /* On note aussi quelle PIECE etait ouverte : si son rang change entre-temps
     (reclassement d'un ancien enregistrement), on la retrouve par son
     identifiant plutot que de rouvrir la piece qui occupe desormais ce rang. */
  var etapeEnCours = etapes()[pas];

    }

function manques(e){
  var m = [];
  /* Un champ rempli d'espaces n'est pas rempli : sans ce controle, un constat
     pouvait etre edite avec une adresse ou un nom de partie vide. */
  function vide(v){ return !v || !String(v).trim(); }
  if(e.id === "type" && !S.type) m.push({msg:"Choisis d'abord entrée ou sortie.", ou:".choix"});
  if(e.id === "type" && S.type === "sortie" && !S.origineSortie) m.push({msg:"Indique comment établir cette sortie : de zéro, ou depuis le fichier d'entrée.", ou:".choix"});
  if(e.id === "logement"){
    if(!S.typeLogement) m.push({msg:"Choisis le type de logement.", ou:".choix"});
    if(vide(S.adresse)) m.push({msg:"L'adresse du logement est obligatoire.", ou:"[data-path=adresse]"});
  }
  if(e.id === "parties"){
    if(vide(S.bailleur.nom)) m.push({msg:"Le nom du bailleur est obligatoire.", ou:"[data-path='bailleur.nom']"});
    if(!S.locataires[0] || vide(S.locataires[0].nom)) m.push({msg:"Le nom du locataire est obligatoire.", ou:"[data-req=loc0]"});
  }
  if(e.id === "composition" && !S.pieces.length) m.push({msg:"Ajoute au moins une pièce pour continuer.", ou:".ligne-piece"});
  return m;
}

function marqueManques(m){
  m.forEach(function(x){
    if(!x.ou) return;
    els(x.ou).forEach(function(n){
      n.classList.add("manque");
      var ote = function(){ n.classList.remove("manque"); };
      n.addEventListener("input", ote, {once:true});

  });

  s.classList.add("secoue");

/* ================= rendu ================= */
function dessine(){
  var t = etapes();
  /* Le nombre d'etapes depend du nombre de pieces : si celui-ci diminue alors
     qu'on se trouve plus loin, l'etape courante doit etre ramenee dans les
     bornes. Sans ce filet, l'ecran resterait blanc sans aucun moyen de revenir. */
  pas = Math.max(0, Math.min(pas, t.length - 1));
  var e = t[pas];
  el("#icone-pas").textContent = e.ic || "📋";
  el("#compte-pas").textContent = "Étape " + (pas+1) + " sur " + t.length;
  el("#titre-pas").textContent = e.titre;
  el("#sous-pas").textContent = e.sous;
  el("#jauge").style.width = Math.round(pas/(t.length-1)*100) + "%";
  var tot = 0, faits = 0;
  S.pieces.forEach(function(x){ x.elements.forEach(function(y){ tot++; if(y.etat) faits++; }); });
  el("#marque").textContent = (S.type ? (S.type === "entree" ? "ENTRÉE" : "SORTIE") : "") +
    (tot ? " · " + Math.round(faits / tot * 100) + " %" : "");
  el("#btn-retour").hidden = (pas === 0);
  el("#btn-suivant").hidden = (e.id === "recap");
  var incomplet = manques(e).length > 0;
  el("#btn-suivant").classList.toggle("attente", incomplet);
  el("#btn-suivant").textContent = (t[pas+1] && t[pas+1].id === "recap") ? "Terminer" : "Suivant";
  var suite = t[pas+1];
  el("#nav-suite").innerHTML = suite ? ("Ensuite&nbsp;: " + (suite.ic || "") + " " + esc(suite.titre)) : "";
  el("#nav-suite").hidden = !suite;

  var b = el("#ecran");
  b.innerHTML = "";
  padsSig = [];
  ({type:vType, logement:vLogement, parties:vParties, compteurs:vCompteurs,
    cles:vCles, composition:vComposition, piece:vPiece, final:vFinal, recap:vRecap})[e.id](b, e);

  /* Aucun champ ne doit declencher les suggestions du navigateur. Sur
     tablette, cette barre de suggestions se pose en bas de l'ecran, par-dessus
     les boutons Retour et Suivant, et n'en repart plus : la visite se
     retrouvait bloquee des qu'on avait saisi un texte. Les valeurs saisies ici
     sont propres au logement visite, elles n'ont rien a gagner d'un carnet
     d'adresses. */
  els("input,textarea,select", b).forEach(function(c){
    c.setAttribute("autocomplete", "off");
    c.setAttribute("autocorrect", "off");
  });

  planifie();
  /* La hauteur de la barre du bas change avec la ligne « Ensuite : … ». */
  ajusteBas();
}

function compte(type){ return S.pieces.filter(function(p){ return p.type === type; }).length; }
function renomme(type){

  l.forEach(function(p, i){ if(!p.nomPerso) p.nom = l.length > 1 ? type.split(" / ")[0] + " " + (i+1) : type; });
}
/* Les pieces suivent l'ordre de la liste de composition, et pour un meme type
   l'ordre d'ajout. Sans ce classement, une piece ajoutee apres coup restait a
   la fin : on obtenait « Entrée 1 à 4, Séjour 1 à 4, Cuisine 1 à 7, Entrée 5
   à 8… » au lieu d'une numerotation suivie. */
function rangPiece(type){
  var i = ORDRE.indexOf(type);
  if(i !== -1) return i;
  if(type === "Inventaire du mobilier") return ORDRE.length;
  return ORDRE.length + 1;                       /* pieces personnalisees en dernier */
}
function ordonnePieces(){
  S.pieces = S.pieces.map(function(p, i){ return {p:p, i:i}; })
    .sort(function(a, b){ return (rangPiece(a.p.type) - rangPiece(b.p.type)) || (a.i - b.i); })
    .map(function(x){ return x.p; });
}
function ajoutePiece(type){
  S.pieces.push({id:uid(), type:type, nom:type, nomPerso:false, observations:"", photos:[],
    elements:(PRESETS[type] || BASE).map(function(n){ return {nom:n, etat:"", commentaire:"", photos:[]}; })});
  ordonnePieces();
  renomme(type);
}
function retirePiece(type){
  for(var i = S.pieces.length-1; i >= 0; i--){ if(S.pieces[i].type === type){ S.pieces.splice(i,1); break; } }
  renomme(type);
}

function dessinePhotos(box, cible){
  box.innerHTML = "";
  (cible.photos || []).forEach(function(o, k){
    var c = document.createElement("div");
    c.className = "photo";
    /* decoding="async" : le decodage des photos se fait hors du fil principal,
       l'affichage de la piece ne se fige pas quand elle en compte plusieurs.
       (Un report facon loading="lazy" serait sans effet : les photos sont
       integrees au document, il n'y a aucun telechargement a retarder.) */
    c.innerHTML = '<img alt="" decoding="async"><button title="Supprimer">✕</button><span class="ts"></span>';
    el("img", c).src = srcPhoto(o);
    el(".ts", c).textContent = tsPhoto(o);
    el("button", c).addEventListener("click", function(){ cible.photos.splice(k,1); dessinePhotos(box, cible); touche(); });
    box.appendChild(c);
  });
}
function ajoutePhotos(files, cible, legende, apres){
  if(!cible.photos) cible.photos = [];
  var liste = Array.prototype.slice.call(files || []);
  if(!liste.length) return;
  signale(liste.length > 1 ? "Traitement de " + liste.length + " photos…" : "Traitement de la photo…");
  var ko = 0, i = 0;
  function suite(){
    if(i >= liste.length){
      if(ko) signale(ko + " photo(s) n'ont pas pu être ajoutées.");
      else signale(liste.length > 1 ? liste.length + " photos ajoutées." : "Photo ajoutée.");
      enregistreBrouillon();
      return;
    }
    var f = liste[i++];
    traitePhoto(f, legende, function(o){
      if(o) cible.photos.push(o); else ko++;
      if(apres) apres();
      touche();
      setTimeout(suite, 40);
    });
  }
  suite();
}

function traitePhoto(f, legende, cb){
  var fait = false, u = null;
  var garde = setTimeout(function(){ termine(null); }, 25000);
  function termine(o){
    if(fait) return;
    fait = true;
    clearTimeout(garde);
    if(u){ try{ URL.revokeObjectURL(u); }catch(e){} u = null; }
    cb(o);
  }
  function rendu(src, w, h2){
    if(fait) return;
    var o = null;
    try{
      var max = 1400, r = Math.min(1, max / Math.max(w, h2));
      var cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(w * r));
      cv.height = Math.max(1, Math.round(h2 * r));
      var c = cv.getContext("2d");
      c.drawImage(src, 0, 0, cv.width, cv.height);
      if(src && src.close){ try{ src.close(); }catch(e){} }

      var d = new Date();
      var t = horodate(d);
      var taille = Math.max(13, Math.round(cv.width * 0.026));
      var bande = Math.round(taille * 2.1);
      c.fillStyle = "rgba(15,20,29,.74)";
      c.fillRect(0, cv.height - bande, cv.width, bande);
      c.textBaseline = "middle";
      c.font = "600 " + taille + "px 'IBM Plex Mono', ui-monospace, monospace";
      c.fillStyle = "#F2C14E";
      c.fillText(t, taille * 0.7, cv.height - bande / 2);
      if(legende){
        c.font = "500 " + Math.round(taille * 0.92) + "px 'Public Sans', sans-serif";
        c.fillStyle = "#E8EEF7";
        c.textAlign = "right";
        c.fillText(legende, cv.width - taille * 0.7, cv.height - bande / 2);
        c.textAlign = "left";
      }
      o = {src:cv.toDataURL("image/jpeg", 0.7), t:d.toISOString(), l:legende || ""};
      cv.width = 1; cv.height = 1;
    }catch(e){ o = null; }
    termine(o);
  }
  function viaURL(){
    if(fait) return;
    try{
      u = URL.createObjectURL(f);
      var img = new Image();
      img.onload = function(){ rendu(img, img.naturalWidth || img.width, img.naturalHeight || img.height); };
      img.onerror = function(){ termine(null); };
      img.src = u;
    }catch(e){ termine(null); }
  }
  if(window.createImageBitmap){
    var pr;
    try{ pr = createImageBitmap(f, {imageOrientation:"from-image"}); }
    catch(e){ try{ pr = createImageBitmap(f); }catch(e2){ pr = null; } }
    if(pr && pr.then){
      pr.then(function(bm){ rendu(bm, bm.width, bm.height); }, function(){ viaURL(); });
      return;
    }
  }
  viaURL();
}

function initSignature(cv, qui, btnEffacer, magasin, journal){
  magasin = magasin || S.signatures;
  var ctx = cv.getContext("2d");
  function dim(){
    var r = cv.getBoundingClientRect();
    var img = magasin[qui];
    cv.width = Math.round(r.width * 2);
    cv.height = Math.round(r.height * 2);
    ctx.setTransform(2,0,0,2,0,0);
    ctx.lineWidth = 1.8; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#15233B";
    if(img){ var i = new Image(); i.onload = function(){ ctx.drawImage(i, 0, 0, r.width, r.height); }; i.src = img; }
  }
  setTimeout(dim, 30);
  padsSig.push(dim);
  var trace = false;
  function pos(e){ var r = cv.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; }
  cv.addEventListener("pointerdown", function(e){ trace = true; cv.setPointerCapture(e.pointerId); var p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
  cv.addEventListener("pointermove", function(e){ if(!trace) return; var p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
  function fin(){
    if(!trace) return;
    trace = false;
    magasin[qui] = cv.toDataURL("image/png");
    if(journal) journal[qui] = new Date().toISOString();
    touche();
  }
  cv.addEventListener("pointerup", fin);
  cv.addEventListener("pointerleave", fin);
  cv.addEventListener("pointercancel", fin);
  btnEffacer.addEventListener("click", function(){ ctx.clearRect(0,0,cv.width,cv.height); magasin[qui] = ""; if(journal) journal[qui] = ""; touche(); });
}

function nomFichier(){ return nomDoc() + ".json"; }
function sauver(){
  sauvegarde = true;
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], {type:"application/json"}));
  a.download = nomFichier();
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}
/* Vrai si une visite est en cours et n'a pas encore ete enregistree :
   ouvrir un fichier ecraserait ce travail sans retour possible. */
function travailEnCours(){
  return !sauvegarde && !!(S.adresse || S.pieces.length);
}
function ouvreFichier(pourSortie){
  if(travailEnCours() && !confirm("Un état des lieux est en cours et n'a pas été enregistré. Ouvrir un fichier va le remplacer définitivement. Continuer ?")) return;
  attenteSortie = !!pourSortie;
  el("#fichier-json").click();
}
function charger(txt){
  try{
    var o = repare(JSON.parse(txt));
    if(!o) throw new Error("format");
    S = o;
    if(attenteSortie){
      attenteSortie = false;
      if(S.type === "entree"){ basculeSortie(); }
      else { S.origineSortie = "fichier"; }
    }
    allerA(0);
  }catch(e){
    attenteSortie = false;
    alert("Ce fichier n'est pas un état des lieux lisible. Choisis un fichier .json enregistré depuis cet outil.");
  }
}
function versSortie(){
  if(S.type === "sortie"){ alert("Ce document est déjà un état des lieux de sortie."); return; }
  if(!confirm("Créer l'état des lieux de sortie à partir de celui-ci ? Les états relevés à l'entrée seront gardés en référence et les notes repartiront à vide.")) return;
  basculeSortie();
  /* Cette sortie est derivee de l'entree ouverte, pas d'un fichier choisi :
     aucune des deux cartes de l'etape 1 ne doit apparaitre selectionnee. */
  S.origineSortie = "reprise";
  allerA(0);
}
function basculeSortie(){
  S.type = "sortie";
  S.origineSortie = "fichier";
  S.date = new Date().toISOString().slice(0,10);
  S.faitLe = S.date;
  S.pieces.forEach(function(p){
    p.elements.forEach(function(e){
      e.etatEntree = e.etat || "";
      e.commentaireEntree = e.commentaire || "";
      e.etat = ""; e.commentaire = ""; e.photos = [];
    });
    p.photos = []; p.observations = "";
  });
  S.compteurs.forEach(function(c){ c.indexEntree = c.index; c.index2Entree = c.index2; c.index = ""; c.index2 = ""; });
  S.observations = "";
  /* Le document de sortie doit repartir vierge de toute trace de signature :
     sans cela il porterait les paraphes de l'entree sur chaque page et la
     mention « Signé le … » a la date de l'entree, alors que personne n'a
     encore signé la sortie. */
  S.signatures = {bailleur:"", locataire:""};
  S.horodatage = {bailleur:"", locataire:""};
  S.paraphes = {bailleur:"", locataire:""};
}

  var pied = '<div class="pied-page">' +
    '<div>Paraphe bailleur : ' + (parB ? '<img src="' + parB + '" alt="">' : '<span class="vide"></span>') + '</div>' +
    '<div>Paraphe locataire : ' + (parL ? '<img src="' + parL + '" alt="">' : '<span class="vide"></span>') + '</div>' +
    '<div class="ref">' + (S.adresse ? esc(S.adresse) + ' — ' : '') + (sortie ? "sortie" : "entrée") + ' du ' + frDate(S.date) + '</div></div>';

  /* Le pied de page est place dans un <tfoot> : c'est le seul moyen fiable, a
     l'impression, d'obtenir une bande repetee en bas de CHAQUE page qui reserve
     vraiment sa place. Avec un element en position:fixed, le navigateur le
     dessinait par-dessus le tableau : les dernieres lignes de chaque page
     etaient bien dans le document mais recouvertes, donc perdues au papier. */
  return '<table class="mise"><tfoot><tr><td>' + pied + '</td></tr></tfoot>' +
         '<tbody><tr><td>' + h + '</td></tr></tbody></table>';
}
/* Nom du fichier : EDL-entree/sortie-Nom du locataire-Lieu de la location.
   Les accents sont ramenes a leur lettre simple plutot que remplaces par des
   tirets, sinon « Nîmes » devenait « N-mes ». */
function propre(s, max){
  return String(s == null ? "" : s)
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")   /* \u00ab N\u00eemes \u00bb -> \u00ab Nimes \u00bb */
    /* On n'ecarte que ce qui est interdit ou genant dans un nom de fichier :
       un nom ecrit dans un autre alphabet doit rester lisible, sinon tous les
       constats d'un meme locataire finissaient par s'appeler \u00ab EDL-entree \u00bb. */
    .replace(/[\\/:*?"<>|\u0000-\u001f\u007f]+/g, " ")
    .replace(/[\s.,;]+/g, "-")
    .replace(/-{2,}/g, "-")
    .slice(0, max)
    .replace(/^-+|-+$/g, "");
}
function nomDoc(){
  var locataire = propre(S.locataires[0] && S.locataires[0].nom, 40);
  /* La ville plutot que l'adresse : un nom de fichier plus court et plus
     lisible. On retombe sur l'adresse si la ville n'est pas renseignee. */
  var lieu = propre(S.ville || S.adresse, 48);
  var bouts = ["EDL", (S.type === "sortie" ? "sortie" : "entree"), locataire, lieu]
    .filter(function(x){ return x; });
  /* Sans locataire ni lieu, la date evite que tous les constats portent le
     meme nom et s'ecrasent les uns les autres. */
  if(!locataire && !lieu) bouts.push(S.date);
  return bouts.join("-");
}
/* Vrai pendant une impression lancee par « Terminer » : le document est alors
   deja rendu avec son empreinte, il ne faut pas le regenerer sans elle. */
var enImpression = false;
/* Titre d'origine retenu une fois pour toutes : le relire au moment d'imprimer
   faisait qu'une seconde impression lancee trop vite memorisait le nom de
   fichier de la premiere, et l'onglet gardait ce nom definitivement. */
var titreOrigine = document.title;
function imprimer(){
  if(enImpression) return;                 /* une impression est deja engagee */
  enImpression = true;
  empreinte(function(emp){
    el("#impression").innerHTML = docHTML(emp);
    document.title = nomDoc();
    setTimeout(function(){
      window.print();
      setTimeout(function(){ document.title = titreOrigine; enImpression = false; }, 1500);
    }, 120);
  });
}
function apercu(){
  el("#apercu-doc").innerHTML = docHTML("");
  el("#apercu").classList.add("vu");
  document.body.classList.add("fige");
  el("#apercu").scrollTop = 0;
  var c = el(".apercu-corps");
  if(c) c.scrollTop = 0;
}
function fermeApercu(){
  el("#apercu").classList.remove("vu");
  document.body.classList.remove("fige");
}
function terminer(){
  /* Deux appuis rapproches enregistraient le fichier deux fois. */
  if(enImpression || terminer.enCours) return;
  terminer.enCours = true;
  setTimeout(function(){ terminer.enCours = false; }, 2500);
  sauver();
  var manque = !S.signatures.bailleur || !S.signatures.locataire;
  signale(manque
    ? "Fichier enregistré. Attention : il manque une signature — la fenêtre d'impression s'ouvre."
    : "Fichier .json enregistré. La fenêtre d'impression s'ouvre : choisis « Enregistrer au format PDF ».");
  setTimeout(imprimer, 1100);
}

/* ================= barre du bas toujours atteignable =================
   Sur telephone et tablette, le navigateur ou le systeme posent souvent
   quelque chose en bas de l'ecran : clavier, barre de saisie automatique,
   barre de navigation. Avec un simple bottom:0, la barre Retour / Suivant se
   dessinait dessous et devenait impossible a atteindre. On mesure donc la
   zone reellement visible et on remonte la barre d'autant. On en profite pour
   reserver sous le contenu la hauteur reelle de la barre, plutot qu'une
   valeur fixe qui ne correspond pas a toutes les tailles d'ecran. */
var attenteBas = null;
function ajusteBas(){
  if(attenteBas) return;
  attenteBas = requestAnimationFrame(function(){
    attenteBas = null;
    var vv = window.visualViewport;
    var cache = vv ? Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)) : 0;
    document.documentElement.style.setProperty("--fond", cache + "px");
    var nav = el(".nav"), m = el("main");
    if(nav && m){
      /* La reserve doit couvrir la barre ET la hauteur masquee : la barre
         etant remontee de `cache`, sans cela le bas de l'etape ne pouvait
         plus etre amene au-dessus d'elle quand le clavier etait ouvert. */
      var h = Math.ceil(nav.getBoundingClientRect().height);
      if(h) m.style.paddingBottom = (h + 26 + cache) + "px";
    }
  });
}
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", ajusteBas);
  window.visualViewport.addEventListener("scroll", ajusteBas);
}
window.addEventListener("resize", ajusteBas);
window.addEventListener("orientationchange", ajusteBas);
/* Quand un champ prend le focus, le clavier s'ouvre : on replace la barre et
   on amene le champ dans la zone visible. */
document.addEventListener("focusin", function(ev){
  ajusteBas();
  var c = ev.target;
  if(!c || !/^(INPUT|TEXTAREA|SELECT)$/.test(c.tagName)) return;
  /* On ne deplace la vue que si le champ est reellement hors de la zone
     utilisable : le recentrer a chaque fois qu'on le touche serait penible. */
  setTimeout(function(){
    try{
      var r = c.getBoundingClientRect();
      var fond = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fond")) || 0;
      var nav = el(".nav");
      var bas = window.innerHeight - fond - (nav ? nav.getBoundingClientRect().height : 0);
      if(r.bottom > bas || r.top < 0) c.scrollIntoView({block:"center", behavior:"smooth"});
    }catch(e){}
  }, 350);
});
document.addEventListener("focusout", function(){ setTimeout(ajusteBas, 100); });

/* ================= navigation et menu ================= */
el("#apercu-fermer").addEventListener("click", fermeApercu);
el("#apercu-ok").addEventListener("click", function(){ fermeApercu(); setTimeout(terminer, 150); });
document.addEventListener("keydown", function(e){ if(e.key === "Escape") fermeApercu(); });
el("#btn-suivant").addEventListener("click", suivant);
el("#btn-retour").addEventListener("click", function(){ allerA(pas-1); });
el("#menu-btn").addEventListener("click", function(e){ e.stopPropagation(); el("#menu").classList.toggle("ouvert"); });
document.addEventListener("click", function(){ el("#menu").classList.remove("ouvert"); });
els("#menu button").forEach(function(b){
  b.addEventListener("click", function(){
    var a = b.getAttribute("data-act");
    el("#menu").classList.remove("ouvert");
    /* Toujours accessible depuis le haut de l'ecran : si la barre du bas se
       retrouve masquee par une surcouche du navigateur, la visite peut
       continuer malgre tout. */
    if(a === "suivant") suivant();
    else if(a === "sauver") sauver();
    else if(a === "ouvrir"){ ouvreFichier(false); }
    else if(a === "sortie") versSortie();
    else if(a === "imprimer") terminer();
    else if(a === "apercu") apercu();
    else if(a === "recap") allerA(etapes().length - 1);
    else if(a === "vider"){ if(confirm("Effacer toutes les données saisies ?")){ videBrouillon(); S = neuf(); pas = 0; sauvegarde = true; setTimeout(function(){ dessine(); enregistreBrouillon(); }, 60); } }
  });
});
el("#fichier-json").addEventListener("change", function(ev){
  var f = ev.target.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){ charger(r.result); };
  r.readAsText(f);
  ev.target.value = "";
});
window.addEventListener("beforeunload", function(ev){
  if(sauvegarde) return;
  if(!S.adresse && !S.pieces.length) return;
  ev.preventDefault();
  ev.returnValue = "";
});
/* Toujours regenerer : le garde precedent (« seulement si le bloc est vide »)
   faisait imprimer un instantane perime des qu'une impression avait deja eu
   lieu — un Ctrl+P en debut de visite figeait un document quasi vide. */
window.addEventListener("beforeprint", function(){ if(!enImpression) el("#impression").innerHTML = docHTML(""); });

function repare(o){
  if(!o || typeof o !== "object" || !o.pieces) return null;
  if(!Array.isArray(o.pieces)) return null;
  if(!o.signatures) o.signatures = {bailleur:"", locataire:""};
  if(!o.paraphes) o.paraphes = {bailleur:"", locataire:""};
  if(!o.horodatage) o.horodatage = {bailleur:"", locataire:""};
  if(!o.bailleur) o.bailleur = {nom:"", contact:"", adresse:""};
  /* On ecarte les entrees vides ou non exploitables : un tableau du genre
     [null] passait les controles et faisait planter l'etape « Les parties »
     ainsi que l'edition du document. */
  function objets(v){ return (Array.isArray(v) ? v : []).filter(function(x){ return x && typeof x === "object"; }); }
  o.locataires = objets(o.locataires);
  if(!o.locataires.length) o.locataires = [{nom:"", contact:"", adresse:""}];
  o.compteurs = objets(o.compteurs);
  o.cles = objets(o.cles);
  o.pieces = objets(o.pieces);
  if(!o.date) o.date = new Date().toISOString().slice(0,10);
  if(!o.faitLe) o.faitLe = o.date;
  o.pieces.forEach(function(p){
    if(typeof p.type !== "string" || !p.type) p.type = "Pièce libre";
    if(typeof p.nom !== "string" || !p.nom) p.nom = p.type;
    if(!Array.isArray(p.elements)) p.elements = [];
    if(!Array.isArray(p.photos)) p.photos = [];
    p.elements = objets(p.elements);
    p.elements.forEach(function(e){
      if(typeof e.nom !== "string" || !e.nom) e.nom = "Élément";
      if(!Array.isArray(e.photos)) e.photos = [];
    });
  });
  /* Remet aussi en ordre les etats des lieux enregistres avant ce classement. */
  o.pieces = o.pieces.map(function(p, i){ return {p:p, i:i}; })
    .sort(function(a, b){ return (rangPiece(a.p.type) - rangPiece(b.p.type)) || (a.i - b.i); })
    .map(function(x){ return x.p; });
  return o;
}

(function demarrer(){
  var lance = false;
  function go(){ if(lance) return; lance = true; dessine(); }
  var secours = setTimeout(go, 3500);
  try{
    litBrouillon(function(r){
      clearTimeout(secours);
      try{
        var o = r && r.s ? r.s : r;
        var v = repare(o);
        if(v){
          S = v;
          sauvegarde = true;
          var etp = etapes();
          var np = (r && typeof r.pas === "number") ? r.pas : 0;
          pas = Math.max(0, Math.min(np, etp.length - 1));
          if(r && r.piece){
            for(var i = 0; i < etp.length; i++){
              if(etp[i].id === "piece" && S.pieces[etp[i].i] && S.pieces[etp[i].i].id === r.piece){ pas = i; break; }
            }
          }
          if(S.adresse || S.pieces.length){
            setTimeout(function(){ signale("Reprise automatique : tout a été retrouvé."); }, 500);
          }
        }
      }catch(e){}
      go();
    });
  }catch(e){ clearTimeout(secours); go(); }
})();

/* filet de sécurité : l'application peut être fermée par le système
   pendant la prise de vue — on écrit dès que la page passe en arrière-plan */
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "hidden") enregistreBrouillon();
});
window.addEventListener("pagehide", function(){ enregistreBrouillon(); });
window.addEventListener("blur", function(){ enregistreBrouillon(); });

/* Une mise a jour ne doit JAMAIS interrompre une visite en cours : le
   rechargement donnait l'impression que l'application se fermait toute seule
   au milieu d'un constat. Tant qu'un etat des lieux est commence, on se
   contente d'enregistrer ; la nouvelle version s'appliquera a la prochaine
   ouverture, la page etant de toute facon relue sur le reseau quand il est
   disponible. Renvoie vrai si le rechargement a ete engage. */
function appliqueMaj(){
  if(S.adresse || S.pieces.length){ enregistreBrouillon(); return false; }
  enregistreBrouillon(function(){ setTimeout(function(){ location.reload(); }, 150); });
  return true;
}
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      try{ reg.update(); }catch(e){}
      setInterval(function(){ try{ reg.update(); }catch(e){} }, 60 * 60 * 1000);
    }).catch(function(){});
    /* Au tout premier lancement, la page n'est pas encore controlee : la prise
       de controle initiale declenche aussi « controllerchange », ce qui
       rechargeait l'application quelques instants apres son ouverture. On ne
       recharge que pour une VRAIE mise a jour, c'est-a-dire un changement de
       service worker alors qu'un autre etait deja aux commandes. */
    var premiereInstallation = !navigator.serviceWorker.controller;
    var recharge = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(premiereInstallation){ premiereInstallation = false; return; }
      if(recharge) return;
      recharge = appliqueMaj();
    });
  });
}
</script>
